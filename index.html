<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estación de Escaneo - Entrada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .kiosk-card { max-width: 480px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    #reader { border-radius: 15px; overflow: hidden; min-height: 280px; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card kiosk-card w-100 p-4 border-0 bg-white text-center">
    <!-- Encabezado -->
    <div class="mb-3">
      <div class="d-inline-flex p-3 bg-primary-subtle text-primary rounded-circle mb-2">
        <i class="bi bi-qr-code-scan fs-1"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Registro de Asistencia</h3>
      <p class="text-muted small mb-0">Muestre su código QR frente a la cámara</p>
    </div>

    <!-- Botón de Control -->
    <div class="d-grid gap-2 mb-3">
      <button id="btnToggleCamara" class="btn btn-primary btn-lg rounded-3 fw-bold py-3 shadow-sm" onclick="toggleCamara()">
        <i class="bi bi-camera-video-fill me-2"></i>Activar Cámara en Vivo
      </button>
    </div>

    <!-- Contenedor del Visor -->
    <div id="reader" class="p-2 border rounded-4 bg-light"></div>

    <!-- Mensaje de Resultado -->
    <div id="resultadoEscaneo" class="mt-3 alert text-center fs-6 fw-bold rounded-4 d-none"></div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    // ⚠️ REEMPLAZA ESTA URL CON TU URL DE APPS SCRIPT (Web App URL)
    const API_URL = "https://script.google.com/a/macros/iehp.edu.mx/s/AKfycbyfTW7lwQHW1JmEpdMlPIM65b3JU218Kd9q9EVe40vSnLp1GuUcuBdHFOkisKgymQxY/exec";

    let html5QrCodeScanner = null;
    let escanerActivo = false;
    let escaneandoBloqueado = false;
    let bloqueoEscaneo = false;
    let timerMensaje = null;

    async function toggleCamara() {
      if (escanerActivo) {
        detenerEscaner();
      } else {
        await iniciarEscaner();
      }
    }

    async function iniciarEscaner() {
      const btn = document.getElementById('btnToggleCamara');
      const resultado = document.getElementById('resultadoEscaneo');

      try {
        if (!html5QrCodeScanner) {
          html5QrCodeScanner = new Html5Qrcode("reader");
        }

        await html5QrCodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          onScanSuccess,
          onScanFailure
        );

        escanerActivo = true;
        if (btn) {
          btn.classList.replace('btn-primary', 'btn-outline-danger');
          btn.innerHTML = `<i class="bi bi-stop-circle-fill me-2"></i>Detener Cámara`;
        }
        if (resultado) resultado.classList.add('d-none');

      } catch (err) {
        alert("Asegúrate de permitir el acceso a la cámara en las opciones del navegador.");
      }
    }

    function detenerEscaner() {
      if (html5QrCodeScanner && escanerActivo) {
        html5QrCodeScanner.stop().then(() => {
          escanerActivo = false;
          const btn = document.getElementById('btnToggleCamara');
          if (btn) {
            btn.classList.replace('btn-outline-danger', 'btn-primary');
            btn.innerHTML = `<i class="bi bi-camera-video-fill me-2"></i>Activar Cámara en Vivo`;
          }
        });
      }
    }

    function procesarQRLeido(codigoMatricula) {
      // Evitar lecturas duplicadas continuas del escáner
      if (bloqueoEscaneo) return;
      bloqueoEscaneo = true;
    
      const divRespuesta = document.getElementById('resultadoEscaner') || document.getElementById('mensajeEscaneo');
      if (divRespuesta) {
        divRespuesta.innerHTML = `
          <div class="alert alert-info text-center fw-bold mb-0">
            <div class="spinner-border spinner-border-sm me-2"></div>Procesando entrada...
          </div>`;
      }
    
      const procesarRespuesta = function(res) {
        if (!divRespuesta) return;
        
        if (timerMensaje) clearTimeout(timerMensaje);
    
        if (res.registrado) {
          // ✅ REGISTRO EXITOSO DE ENTRADA
          divRespuesta.innerHTML = `
            <div class="alert alert-success text-center fw-bold shadow-lg mb-0 p-3">
              <div class="fs-4">✅ ¡ENTRADA REGISTRADA!</div>
              <div class="fs-5 text-dark mt-1">${res.nombre}</div>
              <small class="text-success">Hora: ${res.hora}</small>
            </div>`;
        } else if (res.esDuplicado) {
          // ⚠️ ALUMNO YA INGRESÓ HOY
          divRespuesta.innerHTML = `
            <div class="alert alert-warning text-center fw-bold shadow-lg mb-0 p-3">
              <div class="fs-4">⚠️ YA REGISTRÓ ENTRADA HOY</div>
              <div class="fs-5 text-dark mt-1">${res.nombre || res.matricula}</div>
              <small class="text-dark">Este alumno ya fue registrado el día de hoy.</small>
            </div>`;
        } else {
          // ❌ NO ENCONTRADO O ERROR
          divRespuesta.innerHTML = `
            <div class="alert alert-danger text-center fw-bold shadow-lg mb-0 p-3">
              <div class="fs-4">❌ ERROR</div>
              <div>${res.mensaje || 'No se pudo procesar la lectura'}</div>
            </div>`;
        }
    
        // Ocultar mensaje y habilitar escáner tras 3.5 segundos
        timerMensaje = setTimeout(function() {
          if (divRespuesta) divRespuesta.innerHTML = '';
          bloqueoEscaneo = false; 
        }, 3500);
      };
    
      // Llamada al backend
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(procesarRespuesta)
          .withFailureHandler(function(err) {
            if (divRespuesta) {
              divRespuesta.innerHTML = `<div class="alert alert-danger text-center mb-0">Error de conexión al servidor</div>`;
              setTimeout(() => { divRespuesta.innerHTML = ''; bloqueoEscaneo = false; }, 3000);
            }
          })
          .registrarChecada(codigoMatricula);
      } else if (typeof llamarBackend === 'function') {
        llamarBackend("registrarChecada", { matricula: codigoMatricula })
          .then(procesarRespuesta)
          .catch(err => {
            if (divRespuesta) {
              divRespuesta.innerHTML = `<div class="alert alert-danger text-center mb-0">Error de comunicación</div>`;
              setTimeout(() => { divRespuesta.innerHTML = ''; bloqueoEscaneo = false; }, 3000);
            }
          });
      }
    }

    function onScanFailure(error) {}
  </script>
</body>
</html>
