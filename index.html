<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estación de Escaneo - Entrada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .kiosk-card { max-width: 480px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    #reader { border-radius: 15px; overflow: hidden; min-height: 280px; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card kiosk-card w-100 p-4 border-0 bg-white text-center">
    <!-- Encabezado -->
    <div class="mb-3">
      <div class="d-inline-flex p-3 bg-primary-subtle text-primary rounded-circle mb-2">
        <i class="bi bi-qr-code-scan fs-1"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Registro de Asistencia</h3>
      <p class="text-muted small mb-0">Muestre su código QR frente a la cámara</p>
    </div>

    <!-- Botón de Control -->
    <div class="d-grid gap-2 mb-3">
      <button id="btnToggleCamara" class="btn btn-primary btn-lg rounded-3 fw-bold py-3 shadow-sm" onclick="toggleCamara()">
        <i class="bi bi-camera-video-fill me-2"></i>Activar Cámara en Vivo
      </button>
    </div>

    <!-- Contenedor del Visor -->
    <div id="reader" class="p-2 border rounded-4 bg-light"></div>

    <!-- Mensaje de Resultado -->
    <div id="resultadoEscaneo" class="mt-3 alert text-center fs-6 fw-bold rounded-4 d-none"></div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    // ⚠️ REEMPLAZA ESTA URL CON TU URL DE APPS SCRIPT (Web App URL)
    const API_URL = "https://script.google.com/a/macros/iehp.edu.mx/s/AKfycbyfTW7lwQHW1JmEpdMlPIM65b3JU218Kd9q9EVe40vSnLp1GuUcuBdHFOkisKgymQxY/exec";

    let html5QrCodeScanner = null;
    let escanerActivo = false;

    async function toggleCamara() {
      if (escanerActivo) {
        detenerEscaner();
      } else {
        await iniciarEscaner();
      }
    }

    async function iniciarEscaner() {
      const btn = document.getElementById('btnToggleCamara');
      const resultado = document.getElementById('resultadoEscaneo');

      try {
        if (!html5QrCodeScanner) {
          html5QrCodeScanner = new Html5Qrcode("reader");
        }

        await html5QrCodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          onScanSuccess,
          onScanFailure
        );

        escanerActivo = true;
        if (btn) {
          btn.classList.replace('btn-primary', 'btn-outline-danger');
          btn.innerHTML = `<i class="bi bi-stop-circle-fill me-2"></i>Detener Cámara`;
        }
        if (resultado) resultado.classList.add('d-none');

      } catch (err) {
        alert("Asegúrate de permitir el acceso a la cámara en las opciones del navegador.");
      }
    }

    function detenerEscaner() {
      if (html5QrCodeScanner && escanerActivo) {
        html5QrCodeScanner.stop().then(() => {
          escanerActivo = false;
          const btn = document.getElementById('btnToggleCamara');
          if (btn) {
            btn.classList.replace('btn-outline-danger', 'btn-primary');
            btn.innerHTML = `<i class="bi bi-camera-video-fill me-2"></i>Activar Cámara en Vivo`;
          }
        });
      }
    }

    function onScanSuccess(decodedText) {
      const resultado = document.getElementById('resultadoEscaneo');
      if (resultado) {
        resultado.className = "mt-3 alert alert-info text-center fs-6 fw-bold rounded-4";
        resultado.innerHTML = `<i class="bi bi-hourglass-split me-2"></i>Registrando matrícula: ${decodedText}...`;
        resultado.classList.remove('d-none');
      }

      // Enviar a Google Apps Script
      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "registrarChecada", matricula: decodedText })
      })
      .then(res => res.json())
      .then(res => {
        if (resultado) {
          resultado.className = "mt-3 alert alert-success text-center fs-6 fw-bold rounded-4";
          resultado.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>¡Asistencia Registrada!`;
        }
      })
      .catch(err => {
        if (resultado) {
          resultado.className = "mt-3 alert alert-danger text-center fs-6 fw-bold rounded-4";
          resultado.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-2"></i>Error de conexión al guardar.`;
        }
      });
    }

    function onScanFailure(error) {}
  </script>
</body>
</html>
