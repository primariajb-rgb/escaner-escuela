<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estación de Escaneo - Entrada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .kiosk-card { max-width: 480px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    #reader { border-radius: 15px; overflow: hidden; min-height: 280px; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card kiosk-card w-100 p-4 border-0 bg-white text-center">
    <!-- Encabezado -->
    <div class="mb-3">
      <div class="d-inline-flex p-3 bg-primary-subtle text-primary rounded-circle mb-2">
        <i class="bi bi-qr-code-scan fs-1"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Registro de Asistencia</h3>
      <p class="text-muted small mb-0">Muestre su código QR frente a la cámara</p>
    </div>

    <!-- Botón de Control -->
    <div class="d-grid gap-2 mb-3">
      <button id="btnToggleCamara" class="btn btn-outline-danger btn-lg rounded-3 fw-bold py-3 shadow-sm" onclick="toggleCamara()">
        <i class="bi bi-stop-circle-fill me-2"></i>Detener Cámara
      </button>
    </div>

    <!-- Contenedor del Visor -->
    <div id="reader" class="p-2 border rounded-4 bg-light"></div>

    <!-- Mensaje de Resultado -->
    <div id="resultadoEscaneo" class="mt-3"></div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    // URL Web App de Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbyfTW7lwQHW1JmEpdMlPIM65b3JU218Kd9q9EVe40vSnLp1GuUcuBdHFOkisKgymQxY/exec";

    let html5QrScanner = null;
    let escanerActivo = false;
    let bloqueoEscaneo = false;
    let timerMensaje = null;

    function sanearTexto(txt) {
      if (!txt) return '';
      return String(txt).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function toggleCamara() {
      if (escanerActivo) {
        await detenerCamara();
      } else {
        await iniciarCamaraRobusta();
      }
    }

    async function detenerCamara() {
      if (html5QrScanner && escanerActivo) {
        try {
          await html5QrScanner.stop();
          html5QrScanner.clear();
        } catch (e) {
          console.warn("Error al detener cámara:", e);
        }
        escanerActivo = false;
        const btn = document.getElementById('btnToggleCamara');
        if (btn) {
          btn.classList.replace('btn-outline-danger', 'btn-primary');
          btn.innerHTML = `<i class="bi bi-camera-video-fill me-2"></i>Activar Cámara en Vivo`;
        }
      }
    }

    async function iniciarCamaraRobusta() {
      const contenedor = document.getElementById("reader");
      const btn = document.getElementById('btnToggleCamara');
      if (!contenedor) return;

      if (html5QrScanner && escanerActivo) {
        await detenerCamara();
      }

      html5QrScanner = new Html5Qrcode("reader");

      try {
        const dispositivos = await Html5Qrcode.getCameras();
        if (!dispositivos || dispositivos.length === 0) {
          alert("No se encontró ninguna cámara física conectada.");
          return;
        }

        let idCamaraElegida = dispositivos[0].id;
        const camaraTrasera = dispositivos.find(d => 
          d.label.toLowerCase().includes('back') || 
          d.label.toLowerCase().includes('trasera') || 
          d.label.toLowerCase().includes('environment')
        );
        if (camaraTrasera) idCamaraElegida = camaraTrasera.id;

        await html5QrScanner.start(
          idCamaraElegida,
          { fps: 10, qrbox: { width: 220, height: 220 } },
          function(codigoMatricula) {
            procesarQRLeido(codigoMatricula);
          },
          function(err) { /* Ignorar cuadros vacíos */ }
        );

        escanerActivo = true;
        if (btn) {
          btn.classList.replace('btn-primary', 'btn-outline-danger');
          btn.innerHTML = `<i class="bi bi-stop-circle-fill me-2"></i>Detener Cámara`;
        }

      } catch (err) {
        console.error("Error al iniciar cámara:", err);
        const msg = String(err);
        if (msg.includes("NotReadableError") || err.name === "NotReadableError") {
          alert("⚠️ La cámara está ocupada por otra aplicación o pestaña. Ciérralas y reintenta.");
        } else if (msg.includes("NotAllowedError") || err.name === "NotAllowedError") {
          alert("⚠️ Permiso denegado. Concede el acceso a la cámara en el navegador.");
        } else {
          alert("No se pudo iniciar la cámara: " + (err.message || err));
        }
      }
    }

    function procesarQRLeido(codigoMatricula) {
      if (bloqueoEscaneo) return;
      bloqueoEscaneo = true;

      const divRespuesta = document.getElementById('resultadoEscaneo');

      const desbloquearEscaner = function() {
        if (divRespuesta) divRespuesta.innerHTML = '';
        bloqueoEscaneo = false;
      };

      if (divRespuesta) {
        divRespuesta.innerHTML = `
          <div class="alert alert-info text-center fw-bold mb-0 shadow-sm rounded-4">
            <div class="spinner-border spinner-border-sm me-2"></div>Procesando entrada...
          </div>`;
      }

      const mostrarRespuesta = function(res) {
        if (!divRespuesta) {
          desbloquearEscaner();
          return;
        }

        if (timerMensaje) clearTimeout(timerMensaje);

        if (res && res.registrado) {
          divRespuesta.innerHTML = `
            <div class="alert alert-success text-center fw-bold shadow-lg mb-0 p-3 rounded-4">
              <div class="fs-4">✅ ¡ENTRADA REGISTRADA!</div>
              <div class="fs-5 text-dark mt-1">${sanearTexto(res.nombre)}</div>
              <small class="text-success">Hora: ${sanearTexto(res.hora)}</small>
            </div>`;
        } else if (res && res.esDuplicado) {
          divRespuesta.innerHTML = `
            <div class="alert alert-warning text-center fw-bold shadow-lg mb-0 p-3 rounded-4">
              <div class="fs-4">⚠️ YA REGISTRÓ ENTRADA HOY</div>
              <div class="fs-5 text-dark mt-1">${sanearTexto(res.nombre || res.matricula)}</div>
              <small class="text-dark">Este alumno ya fue registrado el día de hoy.</small>
            </div>`;
        } else {
          divRespuesta.innerHTML = `
            <div class="alert alert-danger text-center fw-bold shadow-lg mb-0 p-3 rounded-4">
              <div class="fs-4">❌ ERROR</div>
              <div>${sanearTexto(res ? res.mensaje : 'No se pudo procesar la lectura')}</div>
            </div>`;
        }

        timerMensaje = setTimeout(desbloquearEscaner, 3500);
      };

      // 1. Envío mediante API HTTP (GitHub Pages -> Apps Script)
      if (typeof API_URL !== 'undefined' && API_URL && !window.google) {
        fetch(`${API_URL}?action=registrarChecada&matricula=${encodeURIComponent(codigoMatricula)}`)
          .then(r => r.json())
          .then(data => mostrarRespuesta(data))
          .catch(err => {
            console.error("Error en la petición API:", err);
            if (divRespuesta) {
              divRespuesta.innerHTML = `<div class="alert alert-danger text-center mb-0 rounded-4">Error de conexión al servidor</div>`;
            }
            timerMensaje = setTimeout(desbloquearEscaner, 3000);
          });
      } 
      // 2. Respaldo para cuando se ejecuta nativamente en Google Apps Script
      else if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(mostrarRespuesta)
          .withFailureHandler(function(err) {
            if (divRespuesta) divRespuesta.innerHTML = `<div class="alert alert-danger text-center mb-0 rounded-4">Error de servidor</div>`;
            timerMensaje = setTimeout(desbloquearEscaner, 3000);
          })
          .registrarChecada(codigoMatricula);
      } else {
        setTimeout(desbloquearEscaner, 3000);
      }
    }

    // Iniciar automáticamente al cargar la página
    document.addEventListener('DOMContentLoaded', function() {
      iniciarCamaraRobusta();
    });
  </script>
</body>
</html>
